services:
  mlflow:
    build: .
    container_name: mlflow_server
    ports:
      - "5000:5000"
    volumes:
      - ./mlruns:/app/mlruns
    command: ["python", "-m", "mlflow", "server", "--host", "0.0.0.0", "--port", "5000"]
    restart: unless-stopped

  train:
    build: .
    container_name: pipeline_entrenamiento
    network_mode: "service:mlflow"
    environment:
      - MLFLOW_TRACKING_URI=http://localhost:5000
    volumes:
      - .:/app
    profiles:
      - donotstart
    command: ["python", "train.py"]

  # NUEVO BLOQUE DE INFERENCIA
  inferencia:
    build:
      context: .
      dockerfile: Dockerfile.inferencia
    container_name: api_inferencia
    ports:
      - "8000:8000"
    restart: unless-stopped
